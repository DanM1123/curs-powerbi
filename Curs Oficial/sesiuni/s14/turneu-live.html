<title>Arena Rapoartelor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Concept: premium black-and-emerald game show. Glass panels on pure black, one green accent, quiet type,
   motion only where the game happens (draw, duel, counting, victory). The projector is the stage, phones are controllers. */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
--bg:#000;--bg-2:#0a0d0b;--panel:rgba(24,30,26,.66);--panel-s:#121714;--panel-2:#1b221d;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
--text:#f5f7f5;--text-2:#a5afa8;--text-3:#6b766e;
--green:#30d158;--green-d:#1f8f3c;--mint:#8ff0b8;--deep:#0b3a24;--red:#ff453a;
--volt:var(--green);--cyan:var(--mint);--hot:var(--red);--win:var(--green);
--display:-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,'Segoe UI',system-ui,sans-serif;
--body:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',system-ui,sans-serif;
--r:24px;--shadow:0 30px 80px rgba(0,0,0,.6);--blur:saturate(160%) blur(22px);
color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.gut{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.lbl{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.035em;text-wrap:balance}

/* top bar */
.hud{display:flex;align-items:center;gap:12px;padding-block:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.55);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:600 16px var(--display);letter-spacing:-.02em;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,var(--mint),var(--green) 55%,var(--deep));display:grid;place-items:center;font:700 14px var(--display);color:#00170a;font-style:normal}
.phase{font:500 13px var(--body);color:var(--text-2);padding-left:12px;border-left:1px solid var(--line-2)}
.hud .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--body);color:var(--text-2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.pill.on .dot{background:var(--green);box-shadow:0 0 10px var(--green)}
.ib{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;height:34px;min-width:34px;padding:0 14px;font:500 13px var(--body);color:var(--text-2);transition:background .2s}
.ib:hover{color:var(--text);background:rgba(255,255,255,.12)}
.notice{margin-top:12px;padding:10px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--text-2)}
.notice a{color:var(--mint)}

/* buttons */
.btn{--c:var(--green);--t:#00170a;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;background:var(--c);color:var(--t);font:600 16px var(--body);letter-spacing:-.01em;padding:13px 24px;border-radius:999px;transition:transform .2s cubic-bezier(.2,.8,.2,1),filter .2s,box-shadow .2s;box-shadow:0 0 0 0 rgba(48,209,88,0)}
.btn:hover{filter:brightness(1.08);box-shadow:0 8px 30px -8px rgba(48,209,88,.6)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none;filter:none;box-shadow:none}
.btn.dark{--c:rgba(255,255,255,.08);--t:var(--text);border:1px solid var(--line)}
.btn.dark:hover{--c:rgba(255,255,255,.14);box-shadow:none}
.btn.cy,.btn.win{--c:var(--green)}
.btn kbd{font:500 11px var(--body);opacity:.55;border:1px solid currentColor;padding:1px 6px;border-radius:6px}
.btn.big{font-size:clamp(16px,1.6vw,19px);padding:15px 30px}
.btn.pulse{animation:btnp 2.4s ease-in-out infinite}
@keyframes btnp{50%{box-shadow:0 0 0 8px rgba(48,209,88,.12),0 10px 40px -10px rgba(48,209,88,.7)}}

/* host dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:8px;align-items:center;padding:8px;background:rgba(20,24,21,.72);border:1px solid var(--line);border-radius:999px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow);max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
.dock .btn{padding:11px 20px;font-size:14px}
.dock .btn.big{padding:12px 26px;font-size:15px}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:110px}

/* avatar + player card */
.hex{--pc:#888;flex:none;width:52px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--pc) 55%,#fff),var(--pc) 60%,color-mix(in srgb,var(--pc) 60%,#000));display:grid;place-items:center;font:600 17px var(--display);letter-spacing:-.02em;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.fc{--pc:#888;position:relative;display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);min-width:0;transition:border-color .3s,background .3s}
.fc .who{min-width:0;flex:1}
.fc b{display:block;font:600 16px var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc small{display:block;font:400 12px var(--body);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .tagr{font:600 11px var(--body);padding:3px 9px;border-radius:999px;background:rgba(48,209,88,.16);color:var(--green)}
.fc .x{border:0;background:none;color:var(--text-3);font-size:18px;width:28px;height:28px;border-radius:50%}
.fc .x:hover{color:var(--text);background:rgba(255,255,255,.08)}
.fc.in{animation:pop .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.92) translateY(8px)}100%{opacity:1;transform:none}}
.fc.empty{background:transparent;backdrop-filter:none;border:1px dashed var(--line-2);color:var(--text-3)}
.fc.empty .hex{background:rgba(255,255,255,.05);color:var(--text-3);box-shadow:none;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.fc.ready{border-color:rgba(48,209,88,.55);background:linear-gradient(120deg,rgba(48,209,88,.12),var(--panel) 60%)}
.fc.me{border-color:var(--green)}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;padding-block:44px 28px}
.title .lbl{color:var(--green)}
.title h1{font-size:clamp(48px,7vw,112px);line-height:.95;margin:12px 0 16px;letter-spacing:-.05em}
.title h1 span{display:block;background:linear-gradient(180deg,#fff 10%,var(--mint) 55%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{margin:0;color:var(--text-2);max-width:36em;font-size:18px}
.grid-h{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 14px;gap:12px;flex-wrap:wrap}
.grid-h h2{font-size:22px}
.count{font:500 13px var(--body);color:var(--text-2)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.side-panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.box h3{font-size:19px;margin-bottom:12px}
.join{text-align:center}
.joinurl{margin:6px 0 12px;font:600 22px/1.25 var(--display);letter-spacing:-.02em;color:var(--mint);overflow-wrap:anywhere}
.qr{background:#fff;padding:12px;border-radius:20px;width:204px;height:204px;margin:4px auto 14px;display:grid;place-items:center}
.qr img,.qr canvas{display:block;max-width:100%}
.big-n{font:700 44px/1 var(--display);letter-spacing:-.04em;color:var(--text);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 6px}
.stats div:last-child .big-n{color:var(--green)}
.crit{display:grid;gap:12px}
.crit div{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--text-2)}
.crit b{flex:none;width:28px;height:28px;border-radius:9px;background:rgba(48,209,88,.12);display:grid;place-items:center;font:600 13px var(--body);color:var(--green)}
.crit strong{color:var(--text);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--text-2)}
.field input{width:70px;font:600 17px var(--body);text-align:center;padding:8px;border-radius:12px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--text)}

/* forms */
input[type=text]{width:100%;font:500 17px var(--body);padding:14px 16px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--text);outline:none;transition:border-color .2s}
input[type=text]:focus{border-color:var(--green)}
.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.cls{position:relative;display:block;cursor:pointer}
.cls input{position:absolute;opacity:0;pointer-events:none}
.cls>span{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.2s;height:100%}
.cls .hex{width:32px;font-size:11px}
.cls>span>span:last-child{min-width:0}
.cls b{display:block;font:600 13px var(--body);line-height:1.2}.cls small{display:block;font:400 11px var(--body);color:var(--text-3)}
.cls input:checked+span{border-color:var(--green);background:rgba(48,209,88,.10)}
.cls input:focus-visible+span{outline:2px solid var(--green)}

/* bracket */
.bk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:36px 14px}
.bk-head h1{font-size:clamp(40px,5vw,72px);letter-spacing:-.05em}
.bk-head .lbl{color:var(--green)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 14px var(--body);padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--text-2);font-variant-numeric:tabular-nums}
.chip b{color:var(--text);font-weight:600}
.bwrap{overflow-x:auto;padding-block:14px 20px;flex:1}
.bracket{display:flex;gap:48px;min-width:max-content;align-items:stretch;min-height:100%}
.round{display:flex;flex-direction:column;width:260px}
.round h4{margin:0 0 12px;font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.rbody{flex:1;display:flex;flex-direction:column}
.pair{flex:1;display:flex;flex-direction:column;position:relative}
.pair>.cell{flex:1;display:flex;align-items:center;padding-block:8px}
.round:not(:last-child) .pair.two-m:after{content:"";position:absolute;right:-26px;top:25%;bottom:25%;width:14px;border:1px solid var(--line-2);border-left:0;border-radius:0 12px 12px 0}
.round:not(:last-child) .mn:after{content:"";position:absolute;right:-26px;top:50%;width:12px;border-top:1px solid var(--line-2)}
.round:not(:first-child) .mn:before{content:"";position:absolute;left:-23px;top:50%;width:22px;border-top:1px solid var(--line-2)}
.mn{position:relative;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.mn.next{border-color:rgba(48,209,88,.7);box-shadow:0 0 0 4px rgba(48,209,88,.12),0 20px 50px -20px rgba(48,209,88,.6)}
.mn .tg{position:absolute;top:-11px;left:16px;font:600 11px var(--body);background:var(--green);color:#00170a;padding:2px 10px;border-radius:999px;white-space:nowrap}
.sl{--pc:var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px}
.sl+.sl{border-top:1px solid var(--line)}
.sl .hex{width:30px;font-size:11px}
.sl .nm{flex:1;min-width:0;font:500 15px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .nm small{display:block;font:400 11px var(--body);color:var(--text-3)}
.sl .pts{font:600 15px var(--body);color:var(--text-3);font-variant-numeric:tabular-nums}
.sl.won .pts{color:var(--green)}.sl.won .nm{font-weight:600}
.sl.lost{opacity:.35}
.sl.empty .nm{color:var(--text-3)}.sl.empty .hex{background:rgba(255,255,255,.05);color:var(--text-3)}
.sl.roll .nm{color:var(--mint)}
.sl.roll .hex{animation:breathe .5s ease-in-out infinite}
.sl.landed{animation:land .6s cubic-bezier(.2,1.2,.3,1)}
@keyframes land{0%{transform:scale(1.06);background:rgba(48,209,88,.18)}100%{transform:none;background:transparent}}
.sl.arrive{animation:arrive 1.2s cubic-bezier(.2,1.2,.3,1)}
@keyframes arrive{0%{opacity:0;transform:translateX(-20px);background:rgba(48,209,88,.25)}50%{opacity:1;transform:none}100%{background:transparent}}
.mplay{display:block;width:calc(100% - 16px);margin:0 8px 8px;border:0;border-radius:999px;background:rgba(255,255,255,.06);padding:8px;font:500 13px var(--body);color:var(--text-2)}
.mplay:hover{color:var(--text);background:rgba(255,255,255,.12)}
.mn.next .mplay{background:var(--green);color:#00170a;font-weight:600}
.crown-col{display:flex;flex-direction:column;justify-content:center;align-items:center;width:200px;text-align:center}
.crown-col svg{width:96px;opacity:.18;filter:grayscale(1)}
.crown-col.has svg{opacity:1;filter:drop-shadow(0 10px 30px rgba(48,209,88,.45));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.crown-col b{font:600 20px var(--display);margin-top:10px}

/* duel */
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:380px;flex:1;padding:20px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));transition:min-height .6s}
@media (min-width:900px){.duel{padding-inline:40px}}
.duel.compact{flex:0;min-height:0}
.duel.compact .half{padding:22px 24px;flex-direction:row;gap:16px;justify-content:flex-start}
.duel.compact .half.b{flex-direction:row-reverse}
.duel.compact .half .hex{width:64px;font-size:22px}
.duel.compact .half h2{font-size:clamp(22px,2.6vw,34px)}
.duel.compact .half .cl{display:none}
.duel.compact .core{display:none}
.half{--pc:#888;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:60px 28px;border-radius:32px;overflow:hidden;background:radial-gradient(80% 70% at 50% 0%,color-mix(in srgb,var(--pc) 30%,transparent),transparent 70%),var(--panel);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:filter .6s,opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1),border-color .4s}
.half.enter.a{animation:fromL .9s cubic-bezier(.2,1,.2,1) both}.half.enter.b{animation:fromR .9s cubic-bezier(.2,1,.2,1) both .08s}
@keyframes fromL{0%{transform:translateX(-40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes fromR{0%{transform:translateX(40px);opacity:0}100%{transform:none;opacity:1}}
.half .hex{width:clamp(96px,10vw,140px);font-size:clamp(32px,3.4vw,46px);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 20px 60px -10px color-mix(in srgb,var(--pc) 70%,transparent)}
.half h2{font-size:clamp(30px,4.2vw,62px);line-height:1;overflow-wrap:anywhere;letter-spacing:-.045em}
.half .cl{font:500 15px var(--body);color:var(--text-2)}
.half .fans{font:500 15px var(--body);color:var(--text-2)}
.half .row{justify-content:center}
.half.dim{opacity:.4;transform:scale(.97)}
.half.on{border-color:rgba(48,209,88,.6);box-shadow:0 0 0 4px rgba(48,209,88,.10)}
.half.on .hex{animation:halo 2s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 0 0 14px rgba(48,209,88,.12),0 20px 60px -10px var(--pc)}}
.half.lose{opacity:.35;filter:grayscale(1)}
.half.winr{border-color:var(--green);box-shadow:0 0 0 4px rgba(48,209,88,.15),0 30px 80px -30px rgba(48,209,88,.8)}
.onair{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);background:rgba(48,209,88,.16);color:var(--green);padding:4px 12px;border-radius:999px}
.onair:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.core{position:absolute;left:50%;top:calc(50% + 10px);transform:translate(-50%,-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.vsmark{width:clamp(84px,8vw,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 clamp(26px,2.6vw,36px)/1 var(--display);letter-spacing:-.04em;color:var(--text);background:rgba(0,0,0,.8);border:1px solid var(--line-2);backdrop-filter:var(--blur);box-shadow:0 0 0 8px #000,0 0 60px -10px rgba(48,209,88,.6);animation:vsin 1s cubic-bezier(.2,1.3,.3,1) both .5s}
@keyframes vsin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
.ring{position:relative;width:clamp(170px,17vw,230px);aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.85);box-shadow:0 0 0 8px #000,var(--shadow);backdrop-filter:var(--blur)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.ring .bgc{stroke:rgba(255,255,255,.08)}.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 6px rgba(48,209,88,.6))}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:600 clamp(36px,3.8vw,54px) var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring .t small{display:block;font:500 11px var(--body);letter-spacing:.08em;color:var(--text-3)}
.ring.low .fg{stroke:var(--red);filter:drop-shadow(0 0 6px rgba(255,69,58,.6))}.ring.low .t{color:var(--red)}.ring.over .t{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
/* projector vote: progress ring of ballots */
.tally{position:relative;width:clamp(200px,20vw,270px);aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.88);box-shadow:0 0 0 8px #000,var(--shadow);display:grid;place-items:center;text-align:center}
.tally svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tally circle{fill:none;stroke-width:5}.tally .bgc{stroke:rgba(255,255,255,.08)}.tally .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,1,.2,1);filter:drop-shadow(0 0 8px rgba(48,209,88,.7))}
.tally .big-n{font-size:clamp(60px,6.4vw,92px)}
.tally .lbl{margin-top:4px}
.tally .of{font:500 14px var(--body);color:var(--text-3)}
.tally.bump{animation:tb .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes tb{40%{transform:scale(1.06)}}
.qr.sm{width:150px;height:150px;margin:0;border-radius:16px}
.ctl.vhere{text-align:left;padding-block:0;max-width:880px}
/* site vote: who has voted, then one card with every criterion */
.vstat{display:flex;align-items:center;gap:22px;padding:16px 24px;background:var(--panel);border:1px solid var(--line);border-radius:26px;max-width:880px;width:100%}
.vstat .vs-n{flex:none;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.vstat .vs-n b{font:700 48px/1 var(--display);letter-spacing:-.04em;color:var(--green)}

let actx=null,sound=true;
function tone(f,d,type,vol,slide,delay){
  if(!sound||role==='viewer')return;
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){return}
  const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);
}

/* course site: the db / room / user calls the page makes on claude.ai, backed by Firebase's REST API.
   Values arrive live as server-sent events. Everyone sees the same arena and can drive it; each tab is one voter,
   with a heartbeat in peers/<id> so the arena knows how many votes to wait for. */
function siteRuntime(){
  let me;try{me=sessionStorage.getItem('arena-me');if(!me){me='v'+rid()+rid();sessionStorage.setItem('arena-me',me)}}catch(e){me='v'+rid()+rid()}
  const url=p=>FB+(p?'/'+p:'')+'.json';
  const req=(p,method,body)=>fetch(url(p),{method,body:body===undefined?undefined:JSON.stringify(body),keepalive:method==='DELETE'}).then(r=>{if(!r.ok)throw new Error(method+' '+r.status);return r.json()});
  let conn=false,off=0;const connCbs=[],setConn=c=>{if(c!==conn){conn=c;connCbs.forEach(f=>f(c))}};
  req('clock','PUT',{'.sv':'timestamp'}).then(t=>{off=t-Date.now()}).catch(()=>{});
  /* one live stream of the whole arena per tab (browsers allow only a few open connections per server);
     each listener gets its path whenever that part changes */
  let root=null,loaded=false;const subs=new Set();
  const at=(path,v)=>{const ks=path.split('/').filter(Boolean);if(!ks.length){root=v;return}
    if(!root||typeof root!=='object')root={};let o=root;
    for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}
    if(v==null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=v};
  const get=p=>p.split('/').filter(Boolean).reduce((o,k)=>o&&typeof o==='object'?o[k]:undefined,root);
  const deliver=s=>{const v=get(s.p),j=JSON.stringify(v==null?null:v);if(j!==s.last){s.last=j;s.cb(JSON.parse(j))}};
  const fire=()=>{loaded=true;subs.forEach(deliver)};
  const es=new EventSource(url(''));
  es.addEventListener('put',e=>{const m=JSON.parse(e.data);at(m.path,m.data);fire()});
  es.addEventListener('patch',e=>{const m=JSON.parse(e.data);for(const k in m.data)at(m.path+'/'+k,m.data[k]);fire()});
  es.addEventListener('cancel',()=>{es.close();subs.forEach(s=>s.err&&s.err())});
  es.onopen=()=>setConn(true);es.onerror=()=>setConn(false);
  function stream(p,onValue,onError){
    const s={p,cb:onValue,err:onError,last:undefined};subs.add(s);if(loaded)deliver(s);
    return ()=>subs.delete(s);
  }
  const db={doc:p=>({set:v=>req(p,'PUT',v),onSnapshot:(cb,err)=>stream(p,v=>cb({exists:v!=null,data:()=>v,metadata:{fromCache:false}}),err)})};
  /* peers: online = heartbeat in the last 100 s (browsers slow down timers in background tabs); changes are reported like the claude.ai room does */
  let peersV={},prev={};const pcbs=[];
  const list=()=>{const now=Date.now()+off;return Object.entries(peersV).filter(([,p])=>p&&p.kind==='viewer'&&(p.t||0)>now-100000)
    .map(([k,p])=>({peer:k,by:p.by,kind:'viewer',sameTab:k===me,presence:p.presence||{}}))};
  function emit(){
    const joined=[],updated=[],left=[],seen={};
    list().forEach(p=>{const s=JSON.stringify(p.presence);seen[p.peer]=s;if(p.sameTab)return;if(!(p.peer in prev))joined.push(p);else if(prev[p.peer]!==s)updated.push(p)});
    for(const k in prev)if(!(k in seen))left.push({peer:k});
    prev=seen;if(joined.length||updated.length||left.length)pcbs.forEach(f=>f({joined,updated,left}));
  }
  stream('peers',v=>{peersV=v||{};emit()});setInterval(emit,5000);
  const beat=()=>req('peers/'+me,'PATCH',{kind:'viewer',by:me,t:{'.sv':'timestamp'}}).catch(()=>{});
  beat();setInterval(beat,15000);
  addEventListener('pagehide',()=>{req('peers/'+me+'/t','DELETE').catch(()=>{})});
  addEventListener('pageshow',e=>{if(e.persisted)beat()});
  const room={peers:list,connected:()=>conn,
    presence:()=>Promise.resolve(),
    onPeers(cb){pcbs.push(cb);return ()=>{}},
    onConnection(cb){connCbs.push(cb);return ()=>{}}};
  const user={canEdit:async()=>true,me:async()=>({id:me,name:''}),profiles:async()=>({})};
  return [user,db,room];
}

function fresh(){return {id:rid(),phase:'lobby',players:[],rounds:[],cur:null,timer:8,bal:{},removed:[],clock:null,lastWin:null,fans:{}}}
/* Firebase drops empty arrays and objects, so a saved state may come back without them */
function normalize(d){if(!d||typeof d!=='object'||!d.id)return fresh();const s=JSON.parse(JSON.stringify(d)),f=fresh();for(const k in f)if(s[k]===undefined)s[k]=f[k];return s}
function loadLocal(){try{return normalize(JSON.parse(localStorage.getItem(LKEY)))}catch(e){return fresh()}}

let writing=false,dirty=false,sent='';
/* the state as Firebase stores it (no nulls or empty containers, sorted keys), to recognise our own write coming back */
function canon(v){
  if(Array.isArray(v)){const a=v.map(canon).filter(x=>x!==undefined);return a.length?a:undefined}
  if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{const c=canon(v[k]);if(c!==undefined)o[k]=c});return Object.keys(o).length?o:undefined}
  return v==null?undefined:v;
}
const canonS=v=>JSON.stringify(canon(v));
function save(){
  if(role==='local'){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}return}
  if(role!=='host')return;dirty=true;flush();
}
async function flush(){
  if(writing)return;writing=true;
  while(dirty){dirty=false;try{const v=JSON.parse(JSON.stringify(S));sent=canonS(v);await db.doc('live/state').set(v)}catch(e){toast('Arena nu s-a salvat. Verifică conexiunea.')}}
  writing=false;
}

  function accept(snap){
    const dd=snap.exists?snap.data():null;
    /* on the course site every screen drives the arena, so each one also follows the others' changes */
    if(role==='host'&&ready&&SITE){if(canonS(dd)===sent)return;const prev=S;S=normalize(dd);return onRemote(prev,true)}
    if(role==='host'){if(ready)return;S=normalize(dd);settleDraw();ready=true;clearTimeout(to);render();onPeers({});return}
    const prev=S,was=ready;S=normalize(dd);ready=true;clearTimeout(to);onRemote(prev,was);
  }
  db.doc('live/state').onSnapshot(snap=>{if(snap.metadata.fromCache&&!ready){cached=snap;return}accept(snap)},
    ()=>{clearTimeout(to);if(!ready){role='local';S=loadLocal();ready=true;render()}});
  if(room){room.onPeers(onPeers,()=>{});room.onConnection(()=>updateOnline(),()=>{})}
}

/* everything the room tells us: reactions for all screens; sign-ups, ready and ballots for the host */
function onPeers(ch){
  updateOnline();
  [].concat(ch.updated||[],ch.joined||[]).forEach(p=>{
    const r=p.presence&&p.presence.react;if(!r||typeof r.t!=='number'||!EMO.includes(r.e))return;
    const seen=seenReact[p.peer];seenReact[p.peer]=Math.max(seen||0,r.t);
    if(seen===undefined||r.t<=seen)return;
    spawnEmoji(r.e);
    if(role==='host'&&S.phase==='match'&&S.cur){const x=cx(),st=S.cur.stage,pid=st==='A'?x.a:st==='B'?x.b:null;if(pid)S.fans[pid]=(S.fans[pid]||0)+1;const f=document.getElementById('fans-'+(st==='A'?'a':'b'));if(f&&pid)f.textContent='🔥 '+S.fans[pid]}
  });
  if(role!=='host'||!ready||!room)return;
  const peers=viewers();
  if(S.phase==='match'&&S.cur.stage==='vote'){collect(peers);onVotes()}
  if(S.phase==='match'&&S.cur.stage==='tb'){collectTB(peers);onTB()}
}
function collect(peers){
  const x=cx(),code=x.code;watchBallots(code);
  const ka=P(x.a).key,kb=P(x.b).key;let ch=false;
  peers.forEach(p=>{
    const b=p.presence&&p.presence.ballot;if(!b||b.c!==code||!okBallot(b.s))return;
    const k=keyOf(p);if(k===ka||k===kb)return;
    if(JSON.stringify(ballots[k])!==JSON.stringify(b.s)){if(!ballots[k])SFX.pop();ballots[k]=b.s.slice();ch=true}
  });
  if(ch){onVotes();saveBallots()}
}
function watchBallots(code){

  if(ballotsUnsub){ballotsUnsub();ballotsUnsub=null}
  ballotsCode=code;
  if(role==='local'){ballots=S.bal[code]=S.bal[code]||{};return}
  ballots={};
  ballotsUnsub=db.doc('ballots/'+code).onSnapshot(snap=>{
    const v=(snap.exists&&snap.data().v)||{};
    if(role==='host'&&!SITE){let c=false;for(const k in v)if(!(k in ballots)){ballots[k]=v[k];c=true}if(c)onVotes()}
    else{ballots=v;onVotes()}

}

function tally(){

/* ---------------- tournament logic ---------------- */
const P=id=>S.players.find(p=>p.id===id)||{name:'?',proj:'',key:null};
const cx=()=>S.rounds[S.cur.r][S.cur.m];
function rname(r){const n=S.rounds[r].length;return n===1?'Finala':n===2?'Semifinale':n===4?'Sferturi':n===8?'Optimi':n===16?'Șaisprezecimi':'Runda '+(r+1)}
function bracketSize(n){let s=2;while(s<n)s*=2;return s}
function build(){
  const ps=shuffle(S.players.map(p=>p.id)),n=ps.length,size=bracketSize(n),m=size/2,full=n-m,ms=[];let i=0;
  for(let k=0;k<m;k++)ms.push(k<full?{a:ps[i++],b:ps[i++]}:{a:ps[i++],b:null});
  const fulls=ms.filter(x=>x.b),byes=ms.filter(x=>!x.b),order=[];
  while(fulls.length||byes.length){if(byes.length)order.push(byes.shift());if(fulls.length)order.push(fulls.shift())}
  S.rounds=[order.map(x=>({a:x.a,b:x.b,w:null,sc:null}))];
  for(let c=m/2;c>=1;c/=2)S.rounds.push(Array.from({length:c},()=>({a:null,b:null,w:null,sc:null})));
  S.rounds.forEach((r,ri)=>r.forEach((x,mi)=>x.code=S.id+'-'+ri+'-'+mi));
}
function adv(r,mi){const x=S.rounds[r][mi];if(r+1>=S.rounds.length)return;const nx=S.rounds[r+1][mi>>1];if(mi%2===0)nx.a=x.w;else nx.b=x.w}
function resolveByes(){S.rounds[0].forEach((x,mi)=>{if(x.a&&!x.b){x.w=x.a;x.bye=true;adv(0,mi)}})}
function nextMatch(){for(let r=0;r<S.rounds.length;r++)for(let m=0;m<S.rounds[r].length;m++){const x=S.rounds[r][m];if(x.a&&x.b&&!x.w)return[r,m]}return null}
function champion(){const f=S.rounds[S.rounds.length-1];return f&&f[0].w}
function alive(){if(!S.rounds.length)return S.players.length;const out=new Set();S.rounds.forEach(r=>r.forEach(x=>{if(x.w&&x.a&&x.b)out.add(x.w===x.a?x.b:x.a)}));return S.players.length-out.size}
const lastWinSlot=()=>S.cur.r+1<S.rounds.length?(S.cur.r+1)+'-'+(S.cur.m>>1)+'-'+(S.cur.m%2?'b':'a'):null;
const isFinal=()=>S.cur&&S.rounds.length-1===S.cur.r;

/* ---------------- shell ---------------- */
const PH={lobby:'Lobby',draw:'Tragerea la sorți',bracket:'Tabloul',champion:'Campionul'};
function phaseLabel(){if(S.phase!=='match')return PH[S.phase];return rname(S.cur.r)+' · '+({intro:'Intrarea',A:'Prezentare',B:'Prezentare',vote:'Vot',reveal:'Rezultat',tb:'Departajare'}[S.cur.stage])}
function hud(){

  const mt=isCtl()&&S.phase==='match'&&S.cur?`<button class="ib" data-act="back">← Tablou</button>${S.cur.stage==='reveal'?'<button class="ib" data-act="undo">Anulează rezultatul</button>':''}`:'';
  const tools=!isCtl()?'':mt+`<button class="ib" data-act="sound" aria-label="Sunet">${sound?'🔊':'🔇'}</button><button class="ib" data-act="full" aria-label="Ecran complet">⛶</button>${S.phase!=='lobby'?'<button class="ib" data-act="reset">↺ Arenă nouă</button>':''}${S.phase!=='lobby'||S.players.length?'<button class="ib" data-act="wipe">De la zero</button>':''}`;
  const note=role==='local'?`<div class="notice gut" style="margin-inline:max(16px,env(safe-area-inset-left,0px))">${LIVE||SITE?'Nu te-ai putut conecta la arena live: pagina merge doar pe acest ecran și voturile se adaugă manual.':`Varianta offline: merge doar pe acest ecran, voturile se adaugă manual. Arena live, cu telefoanele cursanților, e <a href="${esc(SHARE_URL)}" target="_blank" rel="noopener">aici</a>.`}</div>`:'';
  return `<header class="hud gut"><div class="logo"><i>R</i>Arena Rapoartelor</div>${ready?`<span class="phase">${esc(phaseLabel())}</span>`:''}<span class="sp"></span>${st}${tools}</header>${note}`;
}
function updateOnline(){
  ['online','online2'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=viewers().length});

}
function render(){
  if(!ready)return;
  viewKey=vkey();clearInterval(tickH);tickH=null;drawTok++;
  if(S.phase!=='match'&&ballotsUnsub){ballotsUnsub();ballotsUnsub=null;ballotsCode=null}
  if(role==='viewer'){
    const body=S.phase==='lobby'?cLobby():S.phase==='match'?cMatch():S.phase==='champion'?cChamp():cWait();
    app.innerHTML=hud()+`<main class="ctl gut">${body}</main>`;
    afterCtl();return;
  }
  if(S.phase==='lobby')return sLobby();
  if(S.phase==='draw'||S.phase==='bracket')return sBracket();
  if(S.phase==='match')return sMatch();
  if(S.phase==='champion')return sChamp();
}
function dock(btns){return `<nav class="dock" aria-label="Comenzi">${btns.join('')}</nav>`}

/* ---------------- projector: lobby ---------------- */

    +Array.from({length:Math.max(0,slots-n)},()=>'<div class="fc empty"><span class="hex">?</span><span class="who"><b>Loc liber</b><small>așteaptă un jucător</small></span></div>').join('');

    <div class="grid-h"><h2>Alege-ți luptătorii</h2><span class="count">${n} JUCĂTORI${size?' · TABLOU DE '+size:''}</span></div>

    <div class="stats" style="grid-template-columns:1fr"><div><div class="big-n" id="online2">${viewers().length}</div><span class="lbl">online pentru vot</span></div></div>`:''}
    <div class="box"><h3>Cum se punctează</h3><div class="crit">${CATS.map((c,i)=>`<div><b>${pad2(i+1)}</b><span><strong>${c.ic} ${c.t}.</strong> ${c.d}</span></div>`).join('')}</div>
      <p class="lbl" style="margin:12px 0 0;line-height:1.6">Note 1–5 · scor = suma celor 4 medii · max 20</p></div>

const classes=(name,sel)=>Object.entries(PROJ).map(([k,p])=>`<label class="cls" style="--pc:${p.c}"><input type="radio" name="${name}" value="${k}" ${sel===k?'checked':''}><span><span class="hex" style="--pc:${p.c}">${esc(ini(p.n))}</span><span><b>${esc(p.n)}</b><small>${esc(p.k)}</small></span></span></label>`).join('');

/* ---------------- projector: bracket ---------------- */
function sl(pid,o){
  o=o||{};
  if(o.roll)return `<div class="sl roll" data-pid="${pid||''}"><span class="hex" style="--pc:var(--panel-2)">?</span><span class="nm">…</span></div>`;
  if(!pid)return `<div class="sl empty"><span class="hex">${o.bye?'–':'?'}</span><span class="nm">${o.bye?'liber<small>trece direct</small>':'în așteptare'}</span></div>`;
  const p=P(pid);
  return `<div class="sl ${o.cls||''}" style="--pc:${pj(p.proj).c}">${hex(p)}<span class="nm">${esc(p.name)}<small>${esc(pj(p.proj).n)}</small></span>${o.pts!=null?`<span class="pts">${fmt(o.pts)}</span>`:''}</div>`;
}
function bracketHTML(ctl){
  const drawing=S.phase==='draw',nx=drawing?null:nextMatch(),ch=champion(),chp=ch&&P(ch);
  const cols=S.rounds.map((round,r)=>{
    const pairs=[];for(let i=0;i<round.length;i+=2)pairs.push(round.slice(i,i+2).map((x,k)=>[x,i+k]));
    return `<div class="round"><h4>${rname(r)}</h4><div class="rbody">${pairs.map(pr=>`<div class="pair ${pr.length===2?'two-m':''}">${pr.map(([x,mi])=>`<div class="cell">${mn(x,r,mi,drawing,nx,ctl)}</div>`).join('')}</div>`).join('')}</div></div>`;
  }).join('');
  return `<div class="bwrap"><div class="bracket">${cols}<div class="crown-col ${chp?'has':''}">${CUP}${chp?`<b>${esc(chp.name)}</b>`:'<span class="lbl">Trofeul</span>'}</div></div></div>`;
}
function mn(x,r,mi,drawing,nx,ctl){
  const isNext=nx&&nx[0]===r&&nx[1]===mi,playable=x.a&&x.b&&!x.w,done=x.w&&x.a&&x.b;
  const tA=x.sc?sum(x.sc.a):null,tB=x.sc?sum(x.sc.b):null,st=pid=>!x.w?'':x.w===pid?'won':'lost';
  let a,b;
  if(drawing&&r===0){a=sl(x.a,{roll:true});b=x.b?sl(x.b,{roll:true}):sl(null,{bye:true})}
  else if(drawing){a=sl(null);b=sl(null)}
  else{a=sl(x.a,{cls:x.bye?'':st(x.a),pts:done?tA:null});b=x.bye?sl(null,{bye:true}):sl(x.b,{cls:st(x.b),pts:done?tB:null})}
  a=a.replace('<div class="sl','<div data-slot="'+r+'-'+mi+'-a" class="sl');b=b.replace('<div class="sl','<div data-slot="'+r+'-'+mi+'-b" class="sl');
  const btn=drawing||!ctl?'':playable?`<button class="mplay" data-act="play" data-r="${r}" data-m="${mi}">${isNext?'▶ Intră în duel':'Joacă'}</button>`:done?`<button class="mplay" data-act="view" data-r="${r}" data-m="${mi}">Reluare</button>`:'';
  return `<div class="mn ${isNext?'next':''}">${isNext?'<span class="tg">Următorul duel</span>':''}${a}${b}${btn}</div>`;
}
function sBracket(){
  const drawing=S.phase==='draw',nx=drawing?null:nextMatch(),ch=champion();
  const played=S.rounds.flat().filter(x=>x.w&&x.a&&x.b&&!x.bye).length;
  const prim=drawing?'':ch?`<button class="btn big pulse" id="primary" data-act="champ">🏆 Ceremonia <kbd>Space</kbd></button>`:nx?`<button class="btn big pulse" id="primary" data-act="play" data-r="${nx[0]}" data-m="${nx[1]}">▶ Următorul duel <kbd>Space</kbd></button>`:'';
  app.innerHTML=hud()+`<main class="screen gut"><div class="bk-head"><div><div class="lbl" style="color:var(--cyan)">Arena rapoartelor</div><h1>${drawing?'Tragerea la sorți':'Tabloul'}</h1></div>
    <div class="chips"><span class="chip">în arenă <b>${alive()}</b>/${S.players.length}</span><span class="chip">dueluri <b>${played}</b>/${S.players.length-1}</span></div></div>
    ${bracketHTML(true)}</main>`+(prim?dock([prim]):'');
  if(S.lastWin){const el=document.querySelector(`[data-slot="${S.lastWin}"]`);if(el){el.classList.add('arrive');SFX.whoosh()}S.lastWin=null;save()}
  const ne=document.querySelector('.mn.next');if(ne)ne.scrollIntoView({block:'nearest',inline:'center'});
}
/* a draw interrupted by a reload: finish it without the animation */
function settleDraw(){if(S.phase==='draw'){resolveByes();S.phase='bracket'}}
function animateDraw(done){
  const tok=drawTok,slots=[...document.querySelectorAll('.sl.roll')],names=S.players.map(p=>p.name),step=reduceMotion()?40:300;
  slots.forEach((el,i)=>{
    const nm=el.querySelector('.nm');
    const iv=setInterval(()=>{if(tok!==drawTok)return clearInterval(iv);nm.textContent=names[Math.floor(Math.random()*names.length)];if(i===0)SFX.roll()},70);
    setTimeout(()=>{clearInterval(iv);if(tok!==drawTok)return;const t=document.createElement('div');t.innerHTML=sl(el.dataset.pid);const s=t.firstElementChild;s.dataset.slot=el.dataset.slot;s.classList.add('landed');el.replaceWith(s);SFX.pop()},600+i*step);
  });
  setTimeout(()=>{if(tok!==drawTok)return;if(done)done();confettiBurst({particleCount:80,spread:90,origin:{y:.25}})},600+slots.length*step+700);
}
function runDraw(){
  build();S.phase='draw';save();splash('Tragerea la sorți','cine pe cine?');
  setTimeout(()=>{render();animateDraw(()=>{resolveByes();S.phase='bracket';save();render()})},700);
}

/* ---------------- projector: duel ---------------- */
const STAGES=['intro','A','B','vote','reveal'];
const TBQ='Ce raport ai prezenta mâine conducerii companiei?';
function sMatch(){
  const {stage}=S.cur,x=cx(),A=P(x.a),B=P(x.b),si=stage==='tb'?4:STAGES.indexOf(stage),sc=x.sc,res=stage==='reveal'||stage==='tb';
  const showRes=stage==='reveal'&&x.w&&!animReveal;
  const cls=side=>stage==='A'?(side==='a'?'on':'dim'):stage==='B'?(side==='b'?'on':'dim'):showRes?(x.w===x[side]?'winr':'lose'):'';
  const half=(p,side)=>`<section class="half ${side} ${stage==='intro'?'enter':''} ${cls(side)}" id="h-${side}" style="--pc:${pj(p.proj).c}">${hex(p)}<div><div class="cl">${esc(pj(p.proj).n)}</div><h2>${esc(p.name)}</h2>
    <div class="row" style="margin-top:10px">${cls(side)==='on'?'<span class="onair">Pe scenă</span>':''}<span class="fans" id="fans-${side}">${S.fans[x[side]]?'🔥 '+S.fans[x[side]]:''}</span></div></div></section>`;
  let core='',caption='',btns=[];
  if(stage==='intro'||stage==='A'||stage==='B')core='<div class="vsmark">VS</div>';
  if(stage==='A')btns=[`<button class="btn big" id="primary" data-act="stage" data-s="B">Gata · prezintă ${esc(first(B.name))} <kbd>Space</kbd></button>`];
  if(stage==='B')btns=[`<button class="btn big" id="primary" data-act="stage" data-s="vote">Gata · votul <kbd>Space</kbd></button>`];
  if(stage==='vote'){
    if(!SITE)core=`<div class="tally" id="tally"><svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="56"/><circle class="fg" id="vfg" cx="60" cy="60" r="56"/></svg><div><div class="big-n" id="vcount">0</div><div class="of" id="vof"></div><div class="lbl">voturi blocate</div></div></div>`;
    caption=(SITE?'<div class="vstat"><div class="vs-n"><b id="vcount">0</b><span id="vof"></span></div><div style="min-width:0;flex:1"><div class="lbl">au votat</div><div class="wall" id="wall"></div></div></div><div class="ctl vhere"><div id="vbox"></div></div>':`<div class="votezone"><div class="crit-mini">${CATS.map((c,i)=>`<div><b>${i+1}</b>${c.t}</div>`).join('')}</div></div>`)+`
      ${SITE?'':'<div class="wall" id="wall"></div>'}
      <p>${SITE?'Fiecare dă note de pe ecranul lui. Când au votat toți, apăsați „Vezi rezultatele”.':role==='host'?'Rezultatul apare singur când au votat toți cei conectați. Concurenții nu votează în propriul duel.':'Adăugați voturile cu „Vot manual”, apoi închideți votul de jos.'}</p>`;
  }
  if((stage==='vote'||stage==='tb')&&isCtl())btns=[`<button class="btn dark" data-act="manual">+ Vot manual</button>`,`<button class="btn" data-act="closevote">${SITE?'Vezi rezultatele':'Închide votul'}</button>`];
  if(res&&sc){
    const tie=stage==='tb'?`<div class="tbq"><div class="lbl">Egalitate · întrebare de departajare</div><h2>${esc(TBQ)}</h2>
      <div class="tbn"><span class="big-n" id="tbcount">0</span><span id="tbof"></span></div>
      ${SITE?`<div class="tbpick">${[['a',A],['b',B]].map(([sd,p])=>`<button class="tbb ${myTB[x.code]===sd?'sel':''}" data-act="tbv" data-v="${sd}">${hex(p)}<b>${esc(p.name)}</b><small>${esc(pj(p.proj).n)}</small></button>`).join('')}</div><p class="status" id="tbst">${myTB[x.code]?'Trimis. Se confirmă…':'Alege un raport.'}</p>`
        :`<p>${role==='host'?'Cursanții aleg pe telefon unul dintre cele două rapoarte.':'Adăugați răspunsurile cu „Vot manual”.'}</p>`}</div>`:'';
    caption=tie+boardHTML(x,A,B);
    if(stage==='reveal'&&(x.w||animReveal))btns=[isFinal()?`<button class="btn big pulse" id="primary" data-act="champ" ${animReveal?'disabled':''}>Ceremonia <kbd>Space</kbd></button>`:`<button class="btn big" id="primary" data-act="back" ${animReveal?'disabled':''}>Mai departe <kbd>Space</kbd></button>`];
  }
  app.innerHTML=hud()+`<main class="screen"><div class="gut"><div class="stagebar">${STAGES.map((s,i)=>`<span class="${i===si?'on':i<si?'done':''}"></span>`).join('')}</div></div>
    <div class="duel ${res||(SITE&&stage==='vote')?'compact':''}" id="duel">${half(A,'a')}${half(B,'b')}<div class="core">${core}</div></div>
    <div class="capt gut" id="capt">${caption}</div></main>`+(btns.length?dock(btns):'');
  if(stage==='intro'){SFX.whoosh();setTimeout(()=>{SFX.hit();shake()},450)}
  if(stage==='vote'||res)watchBallots(x.code);
  if(stage==='vote'){lastN=-1;if(role==='host')collect(viewers());if(SITE)paintVote();onVotes()}
  if(stage==='tb'){if(role==='host')collectTB(viewers());onTB()}
  if(stage==='reveal'&&sc&&animReveal)animateReveal(x);
}
/* reveal board: a row per criterion (A grows left of the label, B right), the total, and the tie-break when there was one */
function boardHTML(x,A,B){
  const sc=x.sc,all=animReveal==='all',tbAnim=animReveal==='tb';
  const row=(lab,sub,va,vb,max,cls,pend,int)=>{const f=v=>int?String(v):fmt(v);return `<div class="brow ${cls} ${pend?'pending':'done'}" data-max="${max}" data-int="${int?1:''}" data-a="${va}" data-b="${vb}">
    <div class="bh l ${!pend&&va>vb?'lead':''}"><div class="bt"><i style="width:${pend?0:(max?va/max*100:0)}%"></i></div><span class="bv">${pend?'–':f(va)}</span></div>
    <div class="lab">${lab}${sub?`<small>${sub}</small>`:''}</div>
    <div class="bh r ${!pend&&vb>va?'lead':''}"><div class="bt"><i style="width:${pend?0:(max?vb/max*100:0)}%"></i></div><span class="bv">${pend?'–':f(vb)}</span></div></div>`};
  let h=CATS.map((c,i)=>row(c.ic+' '+c.t,'',sc.a[i],sc.b[i],5,'',all,false)).join('')
    +row('Total',sc.n+' '+(sc.n===1?'vot':'voturi')+' · din 20',sum(sc.a),sum(sc.b),20,'tot',all,false);
  if(x.tb){const t=x.tb.a+x.tb.b;h+=row('⚖️ Departajare',esc(TBQ)+(x.coin?' · decis prin tragere la sorți':''),x.tb.a,x.tb.b,t,'tbr',tbAnim,true)}
  return `<div class="board" id="board">${h}</div><div class="winline ${!animReveal&&x.w&&S.cur.stage==='reveal'?'show':''}" id="winline">${x.w&&S.cur.stage==='reveal'?'<span>'+esc(winText(x))+'</span>':''}</div>`;
}
const winText=x=>P(x.w).name+(isFinal()?' câștigă arena':' merge mai departe');
function shake(){const d=$('#duel');if(!d||reduceMotion())return;d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
function paintTimer(){}

/* a duel opens with the VS screen and a 3-2-1, then the first player is on stage */
async function startMatch(r,m){
  S.phase='match';S.cur={r,m,stage:'intro'};animReveal=false;save();render();
  const still=()=>S.phase==='match'&&S.cur&&S.cur.r===r&&S.cur.m===m&&S.cur.stage==='intro';
  await wait(1300);
  for(const n of ['3','2','1']){if(!still())return;splash(n,'',600);SFX.tick();await wait(700)}
  if(!still())return;
  splash('Start',P(cx().a).name+' prezintă primul',1000);SFX.go();
  S.cur.stage='A';save();render();
}

/* expected voters: everyone connected except the two players on stage */
function expected(){
  if(role!=='host'||!S.cur)return 0;
  const x=cx(),skip=new Set([P(x.a).key,P(x.b).key]),ks=new Set();
  viewers().forEach(p=>{const k=keyOf(p);if(!skip.has(k))ks.add(k)});
  return ks.size;
}
let lastN=-1,autoT=null;
function onVotes(){
  const el=$('#vcount');
  if(el){
    const n=Object.values(ballots).filter(okBallot).length,exp=expected();
    const fg=$('#vfg'),of=$('#vof'),C=2*Math.PI*56;
    if(fg){fg.style.strokeDasharray=C;fg.style.strokeDashoffset=C*(1-(exp?Math.min(1,n/exp):0))}
    if(of)of.textContent=exp?'din '+exp:'';
    if(n!==lastN){el.textContent=n;if(lastN>=0){const t=$('#tally');if(t){t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump')}}lastN=n;paintWall()}
    if(!SITE&&role==='host'&&S.cur.stage==='vote'&&exp&&n>=exp&&!autoT)autoT=setTimeout(()=>{autoT=null;if(S.phase==='match'&&S.cur.stage==='vote')doReveal(true)},1600+Math.random()*1200);
  }
  if(role==='viewer'||SITE){paintMyStatus();paintTBStatus()}
}
async function paintWall(){
  const el=$('#wall');if(!el)return;
  const ks=Object.keys(ballots).filter(k=>okBallot(ballots[k])),ids=ks.filter(k=>!/^[pm]:/.test(k));
  let ps={};if(user&&ids.length){try{ps=await user.profiles(ids)}catch(e){}}
  el.innerHTML=SITE&&!ks.length?'<span class="none">încă nimeni</span>':'';ks.slice(0,60).forEach(k=>{const p=ps[k];if(p&&p.avatarUrl){const i=document.createElement('img');i.src=p.avatarUrl;i.alt='';i.title=p.name||'';el.appendChild(i)}else el.appendChild(document.createElement('i'))});
}

/* reveal: bars count with suspense, swinging above and below the real value until they settle */
async function doReveal(auto){
  const x=cx(),sc=tally();
  if(!auto&&!sc.n&&!await ask('Niciun vot','Încă nu a votat nimeni. Închizi votul oricum?','Închide votul'))return;
  x.sc=sc;const tA=sum(sc.a),tB=sum(sc.b);
  x.w=Math.abs(tA-tB)<1e-9?null:(tA>tB?x.a:x.b);x.tb=null;

  S.cur.stage='reveal';save();animReveal='all';render();
}
async function animateReveal(x){
  const sc=x.sc,g=reduceMotion()?.03:1,rows=[...document.querySelectorAll('.brow.pending')],mode=animReveal;
  if(role!=='viewer')splash(mode==='tb'?'Departajarea':'Rezultatul','',900);
  await wait(700*g);
  for(let i=0;i<rows.length;i++){
    const row=rows[i];if(!document.body.contains(row))return;
    const max=+row.dataset.max||1,int=!!row.dataset.int,va=+row.dataset.a,vb=+row.dataset.b,tot=row.classList.contains('tot')||row.classList.contains('tbr'),f=v=>int?String(Math.round(v)):fmt(v);
    const [hl,hr]=row.querySelectorAll('.bh'),ia=hl.querySelector('i'),ib=hr.querySelector('i'),na=hl.querySelector('.bv'),nb=hr.querySelector('.bv');
    row.classList.add('live');

    await new Promise(res=>{
      if(dur<60)return res();
      const iv=setInterval(()=>{
        const k=(performance.now()-t0)/dur;if(k>=1){clearInterval(iv);return res()}
        const amp=(1-k*k)*max*.55,ra=Math.max(max*.04,Math.min(max,va+(Math.random()*2-1)*amp)),rb=Math.max(max*.04,Math.min(max,vb+(Math.random()*2-1)*amp));
        ia.style.width=ra/max*100+'%';ib.style.width=rb/max*100+'%';na.textContent=f(ra);nb.textContent=f(rb);
        if(role!=='viewer'&&Math.random()<.5)SFX.roll();
      },80);
    });
    row.classList.remove('live','pending');row.classList.add('done');
    ia.style.width=va/max*100+'%';ib.style.width=vb/max*100+'%';na.textContent=f(va);nb.textContent=f(vb);
    hl.classList.toggle('lead',va>vb);hr.classList.toggle('lead',vb>va);
    [na,nb].forEach(n=>n.animate([{transform:'scale(1.25)'},{transform:'none'}],{duration:350,easing:'cubic-bezier(.2,1.4,.3,1)'}));
    SFX.hit();
    await wait((tot?300:550)*g);
  }
  animReveal=false;

}
function victory(x){
  const wa=x.w===x.a,hw=$(wa?'#h-a':'#h-b'),hl=$(wa?'#h-b':'#h-a');

  const wl=$('#winline');if(wl){wl.innerHTML='<span>'+esc(winText(x))+'</span>';wl.classList.add('show')}
  if(role!=='viewer'){splash(isFinal()?'Campion':'Victorie',P(x.w).name,1700);SFX.fanfare()}

  const p=$('#primary');if(p)p.disabled=false;

/* tie-break: one question, each voter picks A or B; stored as ballots['tb:'+key] = 'a' | 'b' */
function tbCounts(){let a=0,b=0;for(const k in ballots){if(k.slice(0,3)!=='tb:')continue;if(ballots[k]==='a')a++;else if(ballots[k]==='b')b++}return {a,b}}
function collectTB(peers){
  const x=cx(),code=x.code;watchBallots(code);
  const ka=P(x.a).key,kb=P(x.b).key;let ch=false;
  peers.forEach(p=>{const t=p.presence&&p.presence.tb;if(!t||t.c!==code||(t.v!=='a'&&t.v!=='b'))return;
    const k=keyOf(p);if(k===ka||k===kb)return;
    if(ballots['tb:'+k]!==t.v){if(!ballots['tb:'+k])SFX.pop();ballots['tb:'+k]=t.v;ch=true}});
  if(ch){onTB();saveBallots()}
}
let tbT=null;
function onTB(){
  const el=$('#tbcount');
  if(el){const c=tbCounts(),n=c.a+c.b,exp=expected();el.textContent=n;const of=$('#tbof');if(of)of.textContent=exp?'din '+exp+' au răspuns':'au răspuns';
    if(!SITE&&role==='host'&&S.cur.stage==='tb'&&exp&&n>=exp&&!tbT)tbT=setTimeout(()=>{tbT=null;if(S.phase==='match'&&S.cur.stage==='tb')resolveTB()},1600+Math.random()*1200)}
  if(role==='viewer')paintTBStatus();
}
function resolveTB(){
  const x=cx(),c=tbCounts();x.tb=c;
  if(c.a!==c.b)x.w=c.a>c.b?x.a:x.b;else{x.w=Math.random()<.5?x.a:x.b;x.coin=true}
  adv(S.cur.r,S.cur.m);S.lastWin=lastWinSlot();
  S.cur.stage='reveal';save();animReveal='tb';render();
}
async function undo(){
  const {r,m}=S.cur,x=cx();
  if(r+1<S.rounds.length&&S.rounds[r+1][m>>1].w){await ask('Nu se mai poate anula','Duelul următor s-a jucat deja.');return}
  if(!await ask('Anulezi rezultatul?','Votul se redeschide. Voturile primite rămân.','Anulează'))return;
  if(r+1<S.rounds.length){const nx=S.rounds[r+1][m>>1];if(m%2===0)nx.a=null;else nx.b=null}
  for(const k in ballots)if(k.slice(0,3)==='tb:')delete ballots[k];saveBallots();
  x.w=null;x.sc=null;x.tb=null;x.coin=false;S.lastWin=null;S.cur.stage='vote';save();render();
}

/* ---------------- champion ---------------- */
function stats(){
  const st={};S.players.forEach(p=>st[p.id]={p,played:0,won:0,tot:0,cat:[0,0,0,0],reach:0,fans:S.fans[p.id]||0});
  S.rounds.forEach((round,r)=>round.forEach(x=>{
    [x.a,x.b].forEach(id=>{if(id&&st[id])st[id].reach=Math.max(st[id].reach,r+1)});
    if(x.w&&S.rounds.length-1===r&&st[x.w])st[x.w].reach=r+2;
    if(!x.sc||!x.a||!x.b)return;
    [['a',x.a],['b',x.b]].forEach(([s,id])=>{const o=st[id];if(!o)return;o.played++;o.tot+=sum(x.sc[s]);x.sc[s].forEach((v,i)=>o.cat[i]+=v);if(x.w===id)o.won++});
  }));
  Object.values(st).forEach(o=>{o.xp=Math.round(o.tot*10+o.won*50+o.fans*2);o.lvl=Math.floor(o.xp/100)+1});
  return Object.values(st).sort((a,b)=>b.reach-a.reach||b.xp-a.xp);
}
function awards(st){
  const out=CATS.map((c,i)=>{const b=st.filter(s=>s.played).sort((a,b)=>b.cat[i]/b.played-a.cat[i]/a.played)[0];return b?{ic:c.ic,t:c.badge,d:'Cel mai mare punctaj la „'+c.t+'”',s:b,v:fmt(b.cat[i]/b.played)+' / 5'}:null}).filter(Boolean);
  const fav=st.slice().sort((a,b)=>b.fans-a.fans)[0];if(fav&&fav.fans)out.push({ic:'🔥',t:'Favoritul publicului',d:'Cele mai multe reacții din public',s:fav,v:fav.fans+' reacții'});
  return out;
}

/* course site: every criterion on one card, 1-5 for each report, then a button that sends the vote */

  /* after a reload, a vote already sent shows as sent */
  if(myCard[code]===undefined&&okBallot(mine)){myVotes[code]=mine.slice();myCard[code]=5}
  const sel=myVotes[code]=myVotes[code]||Array(8).fill(0);
  if(myCard[code]===5){box.innerHTML=`<div class="card vdone"><span class="vd-ic">✓</span><div><h3>Votul tău a fost trimis</h3><p class="status" id="mystatus">Se confirmă…</p></div><button class="link" data-act="vedit">Schimbă votul</button></div>`;paintMyStatus();return}
  const stars=j=>`<div class="stars" data-j="${j}">${[1,2,3,4,5].map(v=>`<button type="button" data-v="${v}" class="${sel[j]===v?'sel':sel[j]>v?'fill':''}" aria-label="${v}">${v}</button>`).join('')}</div>`;
  const who=p=>`<span class="vf-p">${hex(p)}<b>${esc(p.name)}</b></span>`;
  box.innerHTML=`<div class="card vform"><h3>Notează cele două rapoarte</h3><p class="sub">1 = slab · 5 = excelent. Dă o notă fiecărui raport la toate cele 4 criterii.</p>
    <div class="vf-row vf-head"><span class="vf-c"></span>${who(A)}${who(B)}</div>
    ${CATS.map((c,i)=>`<div class="vf-row"><span class="vf-c"><b>${c.ic} ${c.t}</b><small>${c.d}</small></span>${stars(i)}${stars(4+i)}</div>`).join('')}
    <button class="btn big" id="vsend" data-act="lock" ${okBallot(sel)?'':'disabled'}>Am terminat de votat</button><p class="status" id="mystatus"></p></div>`;
}
function setSlider(el){
  const code=cx().code,sel=myVotes[code],j=+el.dataset.j,v=+el.value,wrap=el.closest('.rate'),num=wrap.querySelector('.num'),changed=sel[j]!==v;
  sel[j]=v;wrap.classList.add('set');el.style.setProperty('--p',(v-1)/4*100+'%');
  wrap.querySelector('.word').textContent=WORD[v];num.textContent=v;
  if(changed){num.classList.remove('tick');void num.offsetWidth;num.classList.add('tick');if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}}
  const i=myCard[code]||0,nx=$('#vnext');if(nx)nx.disabled=!(sel[i]&&sel[4+i]);
}
function lockVote(){
  const code=cx().code,sel=myVotes[code];if(!okBallot(sel)||!room)return;
  (SITE?putBallot(myKey(),sel.slice()):room.presence({ballot:{c:code,s:sel.slice()}})).then(()=>{myCard[code]=5;paintVote();if(navigator.vibrate)try{navigator.vibrate([30,40,80])}catch(err){}})
    .catch(()=>{const ms=$('#mystatus');if(ms)ms.textContent='Votul nu s-a putut trimite. Verifică internetul și încearcă din nou.'});
}
app.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('slider'))setSlider(e.target)});
app.addEventListener('pointerup',e=>{if(e.target.classList&&e.target.classList.contains('slider'))setSlider(e.target)});
app.addEventListener('keyup',e=>{if(e.target.classList&&e.target.classList.contains('slider'))setSlider(e.target)});
const myTB={};
function paintTBStatus(){
  const el=$('#tbst'),k=myKey();if(!el||!S.cur)return;const v=ballots['tb:'+k];
  if(k&&v&&v===myTB[cx().code]){el.className='status ok';el.textContent='Răspunsul tău a ajuns pe ecranul mare.'}
}
function paintMyStatus(){
  const ms=$('#mystatus'),k=myKey();if(!ms||!S.cur)return;const code=cx().code;
  if(k&&okBallot(ballots[k])&&JSON.stringify(ballots[k])===JSON.stringify(myVotes[code])){ms.className='status ok';ms.textContent='Votul tău a ajuns pe ecranul mare.'}
}

/* ---------------- shared helpers ---------------- */
function manualVote(){
  const x=cx(),A=P(x.a),B=P(x.b),sel=Array(8).fill(0);
  if(S.cur.stage==='tb'){
    dlg.innerHTML=`<div class="dlg"><h3>Răspuns manual</h3><p>${esc(TBQ)}</p><div class="tbpick">${[['a',A],['b',B]].map(([sd,p])=>`<button class="tbb" data-v="${sd}">${hex(p)}<b>${esc(p.name)}</b></button>`).join('')}</div><div class="acts"><button class="btn dark" id="mno">Renunță</button></div></div>`;
    dlg.querySelectorAll('.tbb').forEach(b=>b.onclick=()=>{watchBallots(x.code);putBallot('tb:m:'+rid(),b.dataset.v);dlg.close();SFX.pop();onTB()});
    $('#mno').onclick=()=>dlg.close();dlg.showModal();return;
  }
  dlg.innerHTML=`<div class="dlg"><h3>Vot manual</h3><p>Pentru cine nu poate vota de pe telefon.</p>
  ${CATS.map((c,i)=>`<div><div class="lbl" style="color:var(--cyan)">${c.ic} ${c.t}</div>${[A,B].map((p,si)=>`<div class="rate" style="--pc:${pj(p.proj).c};margin-top:6px"><div class="stars" data-j="${si*4+i}">${[1,2,3,4,5].map(v=>`<button type="button" data-v="${v}" aria-label="${esc(p.name)}: ${v}">${v}</button>`).join('')}</div></div>`).join('')}</div>`).join('')}
  <div class="acts"><button class="btn dark" id="mno">Renunță</button><button class="btn" id="msave" disabled>Adaugă votul</button></div></div>`;
  dlg.querySelector('.dlg').onclick=e=>{const b=e.target.closest('.stars button');if(!b)return;pickStar(b,sel);$('#msave').disabled=!okBallot(sel)};
  $('#mno').onclick=()=>dlg.close();
  $('#msave').onclick=()=>{watchBallots(x.code);putBallot('m:'+rid(),sel.slice());dlg.close();SFX.pop();onVotes()};
  dlg.showModal();
}
function pickStar(btn,sel){const g=btn.parentNode,j=+g.dataset.j,v=+btn.dataset.v;sel[j]=v;g.querySelectorAll('button').forEach(z=>{const zv=+z.dataset.v;z.classList.toggle('sel',zv===v);z.classList.toggle('fill',zv<v)})}
function ask(title,text,ok){
  return new Promise(res=>{
    dlg.innerHTML=`<div class="dlg"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn dark" id="dno">${ok?'Renunță':'Am înțeles'}</button>${ok?`<button class="btn" id="dyes">${esc(ok)}</button>`:''}</div></div>`;
    dlg.returnValue='';dlg.onclose=()=>res(dlg.returnValue==='yes');
    $('#dno').onclick=()=>dlg.close();if(ok)$('#dyes').onclick=()=>dlg.close('yes');
    dlg.showModal();
  });
}
let toastH;
function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastH);toastH=setTimeout(()=>el.hidden=true,3500)}
function confettiBurst(o){if(window.confetti&&!reduceMotion())confetti(Object.assign({colors:['#30D158','#8FF0B8','#FFFFFF','#1F8F3C']},o))}
function splash(big,small,ms){
  if(reduceMotion())return;
  const s=document.createElement('div');s.className='splash';s.innerHTML=`<div class="band"></div><b>${esc(big)}${small?`<small>${esc(small)}</small>`:''}</b>`;
  fx.appendChild(s);setTimeout(()=>s.remove(),ms||1000);
}
function spawnEmoji(e){
  const d=document.createElement('div');d.className='emo';d.textContent=e;
  d.style.left=(8+Math.random()*84)+'%';d.style.setProperty('--dx',(Math.random()*120-60)+'px');
  fx.appendChild(d);setTimeout(()=>d.remove(),2900);
}

/* ---------------- events ---------------- */
app.addEventListener('click',async e=>{
  const st=e.target.closest('#vbox .stars button');
  if(st&&SITE){const sel=myVotes[cx().code];pickStar(st,sel);const b=$('#vsend');if(b)b.disabled=!okBallot(sel);return}
  if(st){const code=cx().code,sel=myVotes[code],i=myCard[code]||0;pickStar(st,sel);
    if(sel[i]&&sel[4+i]){const nb=$('#vbox [data-act=vcard][data-i="'+(i+1)+'"]');if(nb)nb.disabled=false;setTimeout(()=>{if((myCard[code]||0)===i){myCard[code]=i+1;paintVote()}},380)}return}
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  /* phone */
  if(a==='react'){const now=Date.now();if(now-lastReact<350||!room)return;lastReact=now;room.presence({react:{e:t.dataset.e,t:now}}).catch(()=>{});spawnEmoji(t.dataset.e);t.animate([{transform:'scale(1.3)'},{transform:'none'}],{duration:200});return}
  if(a==='ready'){if(!room)return;myReady=!myReady;room.presence({ready:myReady}).catch(()=>{});render();return}
  if(a==='editjoin'){editJoin=true;render();return}
  if(a==='vcard'){myCard[cx().code]=+t.dataset.i;paintVote();return}
  if(a==='vedit'){myCard[cx().code]=0;paintVote();onVotes();return}
  if(a==='lock')return lockVote();
  if(a==='tbv'){if(!room||!S.cur)return;const code=cx().code,v=t.dataset.v;(SITE?putBallot('tb:'+myKey(),v):room.presence({tb:{c:code,v}})).then(()=>{myTB[code]=v;render();if(navigator.vibrate)try{navigator.vibrate(30)}catch(err){}}).catch(()=>{const el=$('#tbst');if(el)el.textContent='Nu s-a putut trimite. Încearcă din nou.'});return}
  if(a==='party')return party();
  if(a==='takeover'){if(await ask('Preiei ecranul mare?','Doar pentru trainer: arena se mută pe acest dispozitiv, iar celălalt ecran trece pe vot.','Preiau'))location.replace(location.pathname+'?trainer');return}
  if(!isCtl())return;
  /* projector */
  if(a==='sound'){sound=!sound;try{localStorage.setItem('arena-sound',sound?'1':'0')}catch(err){}t.textContent=sound?'🔊':'🔇';if(sound)SFX.pop();return}
  if(a==='full'){const d=document.documentElement;try{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen().catch(()=>{})}catch(err){}return}
  if(a==='add')return addPlayer();
  if(a==='rm'){const p=S.players.find(x=>x.id===t.dataset.id);if(p&&p.key)S.removed.push(p.key);S.players=S.players.filter(x=>x.id!==t.dataset.id);save();render();return}
  if(a==='draw'){if(S.players.length>=2)runDraw();return}
  /* back to an empty lobby: players, bracket, votes and the site's sign-ups all go */
  if(a==='wipe'){if(!await ask('Arena de la zero?','Se șterg jucătorii, tabloul, voturile și reacțiile. Cursanții se înscriu din nou.','De la zero'))return;
    if(SITE)fetch(FB+'/ballots.json',{method:'DELETE'}).catch(()=>{});
    S=fresh();save();render();return}
  if(a==='reset'){if(!await ask('Arenă nouă?','Jucătorii rămân. Tabloul, voturile și reacțiile se șterg.','Arenă nouă'))return;
    const pl=S.players,tm=S.timer,rm=S.removed;S=fresh();S.players=pl;S.timer=tm;S.removed=rm;save();render();return}
  if(a==='play')return startMatch(+t.dataset.r,+t.dataset.m);
  if(a==='view'){S.phase='match';S.cur={r:+t.dataset.r,m:+t.dataset.m,stage:'reveal'};animReveal=false;save();render();return}
  if(a==='back'||a==='bracketv'){S.phase='bracket';S.cur=null;save();render();return}
  if(a==='stage'){const sg=t.dataset.s;S.cur.stage=sg;save();render();if(sg==='vote'){splash('Votați',SITE?'pe ecranul vostru':'acum',1100);SFX.go()}else{splash(P(sg==='A'?cx().a:cx().b).name,'prezintă',1000);SFX.whoosh()}return}
  if(a==='closevote'){if(S.cur.stage==='vote')return doReveal(false);if(S.cur.stage==='tb')return resolveTB();return}
  if(a==='manual')return manualVote();
  if(a==='reveal')return doReveal();
  if(a==='undo')return undo();
  if(a==='champ'){S.phase='champion';save();splash('Ceremonia','',1200);render();return}
});
document.addEventListener('keydown',e=>{
  if(!isCtl()||dlg.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==='Space'||e.key==='Enter'){const p=$('#primary');if(p&&!p.disabled){e.preventDefault();p.click()}}
  if(e.key==='m'||e.key==='M'){const b=$('[data-act=manual]');if(b)b.click()}
});

bg();
if(LIVE||SITE)boot();
else{role='local';S=loadLocal();settleDraw();ready=true;render()}
})();
</script>
